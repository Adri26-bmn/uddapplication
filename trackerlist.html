
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link rel="stylesheet" href="okayy.css">
</head>

<body>

    <!-- MAIN TITLE -->
    <h1>Task Management System</h1>

    <!-- =========================================
         1. TASK DASHBOARD
    ========================================= -->
    <h3>Task Dashboard</h3>

    <div class="dashboard">
        <div class="dashboard-card total">
            <h4>Total Tasks</h4>
            <p id="totalTasks">0</p>
        </div>

        <div class="dashboard-card pending">
            <h4>Pending</h4>
            <p id="pendingTasks">0</p>
        </div>

        <div class="dashboard-card progress">
            <h4>In Progress</h4>
            <p id="progressTasks">0</p>
        </div>

        <div class="dashboard-card completed">
            <h4>Completed</h4>
            <p id="completedTasks">0</p>
        </div>
    </div>

    <!-- =========================================
         2. ADD TASK FORM
         Used to add new tasks and update existing tasks.
    ========================================= -->
    <h3>Add Task</h3>

    <form id="taskForm">

        <!-- Task Name Input -->
        <div>
            <label for="taskName">Task Name:</label>
            <input type="text" id="taskName" required>
        </div>

        <!-- Task Description Input -->
        <div>
            <label for="description">Description:</label>
            <input type="text" id="description">
        </div>

        <!-- Assign Task Input -->
        <div>
            <label for="assignedTo">Assign To:</label>
            <input type="text" id="assignedTo" required>
        </div>

        <!-- Due Date Input -->
        <div>
            <label for="dueDate">Due Date:</label>
            <input type="date" id="dueDate" required>
        </div>

        <!-- Task Status Selection -->
        <div>
            <label for="status">Status:</label>
            <select id="status">
                <option value="Pending">Pending</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
            </select>
        </div>

        <!-- Submit Task Form -->
        <button type="submit" id="saveButton">Add Task</button>

    </form>

    <!-- =========================================
         3. SEARCH TASK FORM
         Searches tasks by name, description, or assignee.
    ========================================= -->
    <h3>Search</h3>

    <!-- Search Task Input -->
    <input
        type="text"
        id="searchTask"
        placeholder="Search by task name, description, or assigned person..."
        oninput="displayTasks()"
    >

    <!-- Filter Tasks by Status -->
    <select id="filterStatus" onchange="displayTasks()">
        <option value="All">All Tasks</option>
        <option value="Pending">Pending</option>
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
        <option value="Rejected">Rejected</option>
    </select>

    <!-- =========================================
         4. TASK LIST TABLE
         Displays tasks and their available actions.
    ========================================= -->
    <h3>Task List</h3>

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>Task</th>
                <th>Description</th>
                <th>Assigned To</th>
                <th>Due Date</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>

        <!-- Tasks are displayed here using JavaScript -->
        <tbody id="taskList"></tbody>
    </table>

    <!-- =========================================
         5. JAVASCRIPT TASK MANAGEMENT SYSTEM
         Handles adding, editing, deleting, searching,
         filtering, approving, and saving tasks.
         Helped by AI.
    ========================================= -->

    <script>

        // LOAD SAVED TASKS FROM LOCAL STORAGE
        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
        let editIndex = -1;

        const taskForm = document.getElementById("taskForm");

        // ADD OR UPDATE TASK
        taskForm.addEventListener("submit", function(event) {
            event.preventDefault();

            let name = document.getElementById("taskName").value.trim();
            let description = document.getElementById("description").value.trim();
            let assignedTo = document.getElementById("assignedTo").value.trim();
            let dueDate = document.getElementById("dueDate").value;
            let status = document.getElementById("status").value;

            // VALIDATE REQUIRED INPUTS
            if (name === "" || assignedTo === "" || dueDate === "") {
                alert("Please fill in all required fields.");
                return;
            }

            // VALIDATE DUE DATE
            if (dueDate < new Date().toLocaleDateString("en-CA")) {
                alert("Due date cannot be in the past.");
                return;
            }

            // CREATE TASK OBJECT
            let task = {
                name: name,
                description: description,
                assignedTo: assignedTo,
                dueDate: dueDate,
                status: status
            };

            // ADD NEW TASK OR UPDATE EXISTING TASK
            if (editIndex === -1) {
                tasks.push(task);
            } else {
                tasks[editIndex] = task;
                editIndex = -1;

                document.getElementById("saveButton").textContent = "Add Task";
            }

            // SAVE TASKS AND RESET FORM
            saveTasks();
            taskForm.reset();
        });

        // =========================================
        // DISPLAY TASKS AND UPDATE DASHBOARD
        // =========================================
        function displayTasks() {

            let taskList = document.getElementById("taskList");
            let filter = document.getElementById("filterStatus").value;
            let search = document.getElementById("searchTask").value.toLowerCase().trim();

            taskList.innerHTML = "";

            // UPDATE DASHBOARD COUNTS
            document.getElementById("totalTasks").textContent = tasks.length;

            document.getElementById("pendingTasks").textContent =
                tasks.filter(task => task.status === "Pending").length;

            document.getElementById("progressTasks").textContent =
                tasks.filter(task => task.status === "In Progress").length;

            document.getElementById("completedTasks").textContent =
                tasks.filter(task => task.status === "Completed").length;

            // SEARCH AND FILTER TASKS
            let foundTasks = 0;

            tasks.forEach(function(task, index) {

                let taskName = (task.name || "").toLowerCase();
                let description = (task.description || "").toLowerCase();
                let assignedTo = (task.assignedTo || "").toLowerCase();

                let matchesSearch =
                    taskName.includes(search) ||
                    description.includes(search) ||
                    assignedTo.includes(search);

                let matchesFilter =
                    filter === "All" || task.status === filter;

                if (!matchesSearch || !matchesFilter) {
                    return;
                }

                foundTasks++;

                // CREATE TASK TABLE ROW
                let row = taskList.insertRow();

                [
                    task.name,
                    task.description,
                    task.assignedTo,
                    task.dueDate,
                    task.status
                ].forEach(function(value) {
                    let cell = row.insertCell();
                    cell.textContent = value || "";
                });

                // TASK ACTIONS
                let actions = row.insertCell();

                // APPROVE PENDING TASK
                if (task.status === "Pending") {

                    let approveButton = document.createElement("button");
                    approveButton.textContent = "Approve";

                    approveButton.onclick = function() {
                        approveTask(index);
                    };

                    actions.appendChild(approveButton);
                }

                // EDIT TASK BUTTON
                let editButton = document.createElement("button");
                editButton.textContent = "Edit";

                editButton.onclick = function() {
                    editTask(index);
                };

                actions.appendChild(editButton);

                // DELETE TASK BUTTON
                let deleteButton = document.createElement("button");
                deleteButton.textContent = "Delete";

                deleteButton.onclick = function() {
                    deleteTask(index);
                };

                actions.appendChild(deleteButton);

            });

            // DISPLAY MESSAGE IF NO TASKS MATCH
            if (foundTasks === 0) {

                let row = taskList.insertRow();
                let cell = row.insertCell();

                cell.colSpan = 6;
                cell.textContent = "No tasks found.";
                cell.style.textAlign = "center";
            }
        }

        // =========================================
        // EDIT TASK
        // LOADS TASK DETAILS INTO THE FORM
        // =========================================
        function editTask(index) {

            let task = tasks[index];

            document.getElementById("taskName").value = task.name;
            document.getElementById("description").value = task.description;
            document.getElementById("assignedTo").value = task.assignedTo;
            document.getElementById("dueDate").value = task.dueDate;
            document.getElementById("status").value = task.status;

            editIndex = index;

            document.getElementById("saveButton").textContent = "Update Task";
        }

        // =========================================
        // DELETE TASK
        // =========================================
        function deleteTask(index) {

            if (confirm("Are you sure you want to delete this task?")) {
                tasks.splice(index, 1);
                saveTasks();
            }
        }

        // =========================================
        // SAVE TASKS TO LOCAL STORAGE
        // =========================================
        function saveTasks() {

            localStorage.setItem("tasks", JSON.stringify(tasks));
            displayTasks();
        }

        // =========================================
        // APPROVE TASK
        // =========================================
        function approveTask(index) {

            tasks[index].status = "In Progress";
            saveTasks();
        }

        // DISPLAY TASKS WHEN THE PAGE LOADS
        displayTasks();

    </script>

</body>
</html>
